name: Refresh Solana stocks (weekly)

# Refreshes, from public primary sources:
#   data/solana-stocks.json    the issuers' own token lists (xstocks.fi, docs.ondo.finance)
#   data/earnings-dates.json   next earnings dates (JPX 決算発表予定日; company IR on record)
#   data/financials.json       latest disclosed financials (SEC EDGAR XBRL, TDnet 決算短信 XBRL)
# NOT a cost action: no API key, no paid data API, no web search, no model
# call — plain HTTPS GETs of public pages and files. Each script keeps its
# previous rows when a source fails, so a bad week never empties a file. One
# run per week, one commit at most.

on:
  schedule:
    # 20:37 UTC Sunday == 05:37 JST Monday.
    - cron: "37 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: portfolio-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh token list
        run: node scripts/refresh-solana-stocks.mjs

      - name: Check next earnings dates (primary sources)
        run: node scripts/check-earnings-dates.mjs

      - name: Extract latest disclosed financials (SEC / TDnet XBRL)
        run: node scripts/fetch-financials.mjs

      - name: Commit & push data
        run: |
          git config user.name "osd-portfolio-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/solana-stocks.json data/earnings-dates.json data/financials.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore(data): weekly token list, earnings dates and financials refresh"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
