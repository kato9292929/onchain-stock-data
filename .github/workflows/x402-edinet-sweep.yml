name: x402 EDINET sweep (Solana)

# Reuses the AA buyer to pay /api/edinet/{ticker} for the roster on Solana —
# a SEPARATE job with a SEPARATE spend namespace (edinet) and its own cap, so
# EDINET spend never shares a budget or a proof file with the catalyst sweep.
#
# COST ACTION — real funds on mainnet. Schedule is DISABLED. Enable the weekly
# `schedule:` only after: funded wallet + cap set + a devnet-smoke pass + one
# measured mainnet run + owner approval (see docs/x402-solana-buyer.md).
#
#  schedule:
#    - cron: "25 22 * * 1"   # Mondays 22:25 UTC, after the catalyst sweep
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run | devnet-smoke | mainnet-weekly"
        type: choice
        options: [dry-run, devnet-smoke, mainnet-weekly]
        default: dry-run
      only_ticker:
        description: "Single ticker (devnet-smoke)."
        type: string
        default: ""
      max_tickers:
        description: "Cap roster size (0 = all)."
        type: string
        default: "0"
      base_url:
        description: "Endpoint base URL. Blank = production."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: x402-edinet-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run EDINET sweep
        env:
          AA_SOLANA_SECRET_KEY: ${{ secrets.AA_SOLANA_SECRET_KEY }}
          # Separate cap for the EDINET namespace (default 500000 = 0.5 USDC/run).
          WEEKLY_SPEND_CAP_UNITS: ${{ vars.EDINET_WEEKLY_SPEND_CAP_UNITS || '500000' }}
          ENDPOINT_TEMPLATE: "/api/edinet/{ticker}"
          SPEND_NAMESPACE: "edinet"
          PRICE_UNITS: "1000"
          DELAY_MS: "600"
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ONLY_TICKER: ${{ inputs.only_ticker }}
          INPUT_MAX_TICKERS: ${{ inputs.max_tickers }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          export MAX_TICKERS="${INPUT_MAX_TICKERS:-0}"
          [ -n "${INPUT_ONLY_TICKER}" ] && export ONLY_TICKER="${INPUT_ONLY_TICKER}"
          [ -n "${INPUT_BASE_URL}" ] && export OSD_BASE_URL="${INPUT_BASE_URL}"
          case "${INPUT_MODE}" in
            dry-run)        export DRY_RUN=1 ;;
            devnet-smoke)   : "${ONLY_TICKER:?devnet-smoke needs only_ticker}" ;;
            mainnet-weekly) : ;;
            *) echo "unknown mode ${INPUT_MODE}" >&2; exit 1 ;;
          esac
          node scripts/x402-weekly-buyer.mjs

      - name: Commit proof
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          git config user.name "osd-x402-buyer-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proof/ || true
          if git diff --staged --quiet; then
            echo "No proof changes to commit."
          else
            git commit -m "chore(x402): weekly EDINET sweep proof (${{ inputs.mode }})"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
